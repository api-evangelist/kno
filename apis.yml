name: KNO
description: 'Kno, Inc. was a digital textbook and student learning platform founded in May 2009 in Santa
  Clara, California by CEO Osman Rashid (co-founder of Chegg) and CTO Babur Habib. Kno began as a dual-screen
  tablet built for students, abandoned hardware in 2011, and pivoted to eTextbook software delivered across
  iPad, Android, Windows and the web in partnership with textbook publishers. The company raised roughly
  $93 million from Andreessen Horowitz, Intel Capital, Goldman Sachs, FLOODGATE, First Round Capital, SV
  Angel, Advance Publications and GSV Capital before being acquired by Intel in November 2013 for approximately
  $15 million and rebranded as Intel Education Study, which has itself since been discontinued. As of enrichment
  the kno.com domain is parked and redirects to a third-party domain brokerage, and the provider exposes
  no public API, developer portal, documentation, SDK, or other artifact surface to enrich.'
